<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    
    <!-- خط فخم وتصميم أيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Amiri', serif;
            color: #f8fafc;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .welcome-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(234, 179, 8, 0.15),
                inset 0 0 15px rgba(234, 179, 8, 0.05),
                0 25px 50px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(234, 179, 8, 0.3);
            max-width: 600px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ca8a04, #eab308, #ca8a04);
        }

        .cross-icon {
            font-size: 50px;
            color: #eab308;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
        }

        h1 {
            font-size: 36px;
            color: #facc15;
            text-shadow: 
                0 0 10px rgba(250, 204, 21, 0.4),
                2px 2px 0px #000;
            margin-bottom: 15px;
        }

        .bible-verse {
            margin-top: 20px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border-right: 4px solid #eab308;
            text-align: right;
        }

        .bible-verse p {
            font-size: 20px;
            color: #e2e8f0;
            line-height: 1.8;
            font-style: italic;
            margin-bottom: 8px;
        }

        .bible-verse span {
            font-size: 16px;
            color: #facc15;
            display: block;
            text-align: left;
            font-weight: bold;
        }

        /* شريط التنقل السفلي */
        nav.gamer-nav {
            background: rgba(15, 23, 42, 0.95);
            border-top: 2px solid rgba(234, 179, 8, 0.3);
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.8);
        }

        nav.gamer-nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        nav.gamer-nav a i {
            font-size: 20px;
        }

        nav.gamer-nav a:hover, nav.gamer-nav a.active {
            color: #facc15;
            transform: translateY(-3px);
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
        }
    </style>

    <!-- جلب اسم المستخدم من فايرستور بناءً على الرابط (?user=...) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            const welcomeElement = document.getElementById('welcomeName');
            
            // قراءة اسم المستخدم من الرابط (مثال: home.html?user=tony)
            const urlParams = new URLSearchParams(window.location.search);
            const usernameFromUrl = urlParams.get('user');

            if (!usernameFromUrl) {
                welcomeElement.innerText = "يرجى تحديد المستخدم في الرابط";
                return;
            }

            try {
                const docRef = doc(db, "users", usernameFromUrl);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    // عرض اسم المستخدم الحقيقي المستخرج من قاعدة البيانات
                    welcomeElement.innerText = `أهلاً بك يا ${userData.username || usernameFromUrl}`;
                } else {
                    welcomeElement.innerText = "لم يتم العثور على المستخدم";
                }

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                welcomeElement.innerText = "حدث خطأ في الاتصال";
            }
        });
    </script>
</head>
<body>

    <div class="main-content">
        <div class="welcome-card">
            <div class="cross-icon">
                <i class="fas fa-cross"></i>
            </div>
            <h1 id="welcomeName">جاري التحميل...</h1>
            
            <div class="bible-verse">
                <p>"الرب نورى وخلاصى ممن أخاف؟ الرب حصن حياتى ممن أرتعب؟"</p>
                <span>(مزمور 27 : 1)</span>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي مع تمرير نفس الuser في الروابط إن أردت -->
    <nav class="gamer-nav">
        <a href="#" onclick="location.href='profile.html' + location.search">
            <i class="fas fa-user"></i>
            <span>البروفايل</span>
        </a>
        <a href="#" class="active" onclick="location.href='home.html' + location.search">
            <i class="fas fa-house-chimney"></i>
            <span>الرئيسية</span>
        </a>
        <a href="#" onclick="location.href='gallery.html' + location.search">
            <i class="fas fa-images"></i>
            <span>المعرض</span>
        </a>
        <a href="#" onclick="location.href='cart.html' + location.search">
            <i class="fas fa-heart"></i>
            <span>الطلبات</span>
        </a>
        <a href="#" onclick="location.href='notifications.html' + location.search">
            <i class="fas fa-bell"></i>
            <span>الإشعارات</span>
        </a>
    </nav>

</body>
</html>

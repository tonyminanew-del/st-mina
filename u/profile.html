<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - لوحة التحكم</title>
    
    <!-- استيراد خط عربي فخم وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Amiri', serif;
            color: #f8fafc;
        }

        .profile-container {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 
                0 0 30px rgba(56, 189, 248, 0.2),
                0 20px 40px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.35);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 20px;
            position: relative;
        }

        /* حاوية الصورة الشخصية */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            background: #1e293b;
        }

        .upload-btn-label {
            position: absolute;
            bottom: 0;
            left: 0;
            background: #38bdf8;
            color: #020617;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .upload-btn-label:hover {
            background: #7dd3fc;
            transform: scale(1.1);
        }

        #avatar-input {
            display: none;
        }

        h1 {
            color: #38bdf8;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-top: 8px;
        }

        /* صندوق تفاصيل البيانات */
        .info-section {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px 25px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }

        .section-title {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.4);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #64748b;
            font-size: 16px;
        }

        .info-value {
            color: #f1f5f9;
            font-size: 17px;
            font-weight: bold;
        }

        .info-value input {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: 'Amiri', serif;
            font-size: 16px;
            width: 180px;
            text-align: center;
        }

        /* أزرار التحكم */
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'Amiri', serif;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(3, 105, 161, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-2px);
        }

        .btn-save {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
        }

        .btn-save:hover {
            background: linear-gradient(135deg, #15803d, #166534);
        }

        /* قسم الـ QR Code */
        .qr-section {
            margin-top: 25px;
            text-align: center;
            background: #020617;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #1e293b;
        }

        .qr-section h3 {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 12px;
        }

        #qrcode img {
            display: inline-block;
            background: #fff;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            width: 130px;
            height: 130px;
        }

        .loading {
            color: #fde047;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 40px;
        }
    </style>

    <!-- مكتبات Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcUuUmMe8Lok8Ap7IspdQP5Zp8VHykUWE",
            authDomain: "st-mina-c01ec.firebaseapp.com",
            projectId: "st-mina-c01ec",
            storageBucket: "st-mina-c01ec.firebasestorage.app",
            messagingSenderId: "792349150559",
            appId: "1:792349150559:web:8a86bbf57c2c7e351f3aea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isEditing = false;
        let currentUsernameUrl = "";

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            // يمكنك تغيير القيمة الافتراضية هنا لو لم تكتب ?user في الرابط
            currentUsernameUrl = urlParams.get('user');

            const loadingText = document.getElementById('loading-text');
            const profileContent = document.getElementById('profile-content');

            if (!currentUsernameUrl) {
                loadingText.innerText = "يرجى تحديد اسم المستخدم في الرابط (مثال: ?user=tony)";
                loadingText.style.color = "#f87171";
                return;
            }

            try {
                const docRef = doc(db, "users", currentUsernameUrl);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    
                    // تعبئة البيانات
                    document.getElementById('welcome-msg').innerText = `أهلاً بك يا ${userData.username || currentUsernameUrl}`;
                    document.getElementById('val-username').innerText = userData.username || "-";
                    document.getElementById('val-userid').innerText = userData.userId || "-";
                    document.getElementById('val-birthdate').innerText = userData.birthdate || "-";
                    document.getElementById('val-stage').innerText = userData.stage || "-";
                    document.getElementById('val-grade').innerText = userData.grade || "-";
                    document.getElementById('val-address').innerText = userData.address || "-";
                    document.getElementById('val-father').innerText = userData.fatherPhone || "-";
                    document.getElementById('val-mother').innerText = userData.motherPhone || "-";

                    // عرض الصورة إن وجدت أو الحرف الأول
                    if (userData.avatarUrl) {
                        document.getElementById('profile-avatar').src = userData.avatarUrl;
                    } else {
                        document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.username || 'User')}&background=0284c7&color=fff&size=150`;
                    }

                    loadingText.style.display = 'none';
                    profileContent.style.display = 'block';

                    // توليد الـ QR Code
                    generateQRCode();

                } else {
                    loadingText.innerText = "عذراً، لم يتم العثور على بيانات هذا المستخدم!";
                    loadingText.style.color = "#f87171";
                }

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                loadingText.innerText = "حدث خطأ أثناء الاتصال بقاعدة البيانات.";
                loadingText.style.color = "#f87171";
            }
        });

        // دالة توليد الـ QR المحدثة لضمان عمل الـ Scan بنجاح تام
        function generateQRCode() {
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; 
            
            const currentUrl = window.location.href;
            
            const qrImage = document.createElement('img');
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;
            qrImage.alt = "QR Code";
            
            qrContainer.appendChild(qrImage);
        }

        // دالة تبديل وضع التعديل
        window.toggleEditMode = async function() {
            const fields = ['username', 'birthdate', 'stage', 'grade', 'address', 'father', 'mother'];
            const btn = document.getElementById('edit-btn');

            if (!isEditing) {
                fields.forEach(field => {
                    const span = document.getElementById(`val-${field}`);
                    const val = span.innerText === '-' ? '' : span.innerText;
                    span.innerHTML = `<input type="text" id="input-${field}" value="${val}">`;
                });
                btn.innerText = "حفظ التغييرات";
                btn.classList.add('btn-save');
                isEditing = true;
            } else {
                btn.innerText = "جاري الحفظ...";
                try {
                    const docRef = doc(db, "users", currentUsernameUrl);
                    
                    const updatedData = {
                        username: document.getElementById('input-username').value,
                        birthdate: document.getElementById('input-birthdate').value,
                        stage: document.getElementById('input-stage').value,
                        grade: document.getElementById('input-grade').value,
                        address: document.getElementById('input-address').value,
                        fatherPhone: document.getElementById('input-father').value,
                        motherPhone: document.getElementById('input-mother').value,
                    };

                    await updateDoc(docRef, updatedData);

                    fields.forEach(field => {
                        const newVal = document.getElementById(`input-${field}`).value || '-';
                        document.getElementById(`val-${field}`).innerText = newVal;
                    });

                    document.getElementById('welcome-msg').innerText = `أهلاً بك يا ${updatedData.username}`;
                    alert("تم حفظ التعديلات بنجاح! ✅");

                    btn.innerText = "تعديل البيانات";
                    btn.classList.remove('btn-save');
                    isEditing = false;

                } catch (error) {
                    console.error("خطأ أثناء الحفظ:", error);
                    alert("حدث خطأ أثناء حفظ البيانات!");
                    btn.innerText = "حفظ التغييرات";
                }
            }
        }

        // رفع وتغيير الصورة الشخصية
        window.handleImageUpload = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                document.getElementById('profile-avatar').src = base64Image;

                try {
                    const docRef = doc(db, "users", currentUsernameUrl);
                    await updateDoc(docRef, { avatarUrl: base64Image });
                    alert("تم تحديث وحفظ صورة البروفايل بنجاح! 🖼️");
                } catch (error) {
                    console.error("خطأ في حفظ الصورة:", error);
                    alert("حدث خطأ أثناء حفظ الصورة في قاعدة البيانات.");
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</head>
<body>

    <div class="profile-container">
        <!-- رسالة التحميل -->
        <div id="loading-text" class="loading">جاري تحميل الملف الشخصي... ⏳</div>

        <!-- محتوى البروفايل (مخفي لحين تحميل البيانات) -->
        <div id="profile-content" style="display: none;">
            
            <!-- رأس البروفايل (الصورة والترحيب) -->
            <div class="profile-header">
                <div class="avatar-container">
                    <img id="profile-avatar" class="avatar-img" src="" alt="صورة البروفايل">
                    <label for="avatar-input" class="upload-btn-label" title="تغيير الصورة">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatar-input" accept="image/*" onchange="handleImageUpload(event)">
                </div>

                <h1 id="welcome-msg">أهلاً بك</h1>
                <div class="badge">ملف اللاعب / المستخدم</div>
            </div>

            <!-- صندوق البيانات المفصلة -->
            <div class="info-section">
                <div class="section-title">
                    <span>المعلومات الشخصية والدراسية</span>
                    <button id="edit-btn" class="btn" onclick="toggleEditMode()">تعديل البيانات</button>
                </div>
                
                <div class="info-row">
                    <span class="info-label">اسم المستخدم:</span>
                    <span class="info-value" id="val-username">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">رقم المستخدم:</span>
                    <span class="info-value" id="val-userid">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">تاريخ الميلاد:</span>
                    <span class="info-value" id="val-birthdate">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">المرحلة الدراسية:</span>
                    <span class="info-value" id="val-stage">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">الصف الدراسي:</span>
                    <span class="info-value" id="val-grade">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">العنوان:</span>
                    <span class="info-value" id="val-address">--</span>
                </div>
                
                <div class="section-title" style="margin-top: 20px;">أرقام أولياء الأمور</div>
                
                <div class="info-row">
                    <span class="info-label">رقم الأب:</span>
                    <span class="info-value" id="val-father">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">رقم الأم:</span>
                    <span class="info-value" id="val-mother">--</span>
                </div>
            </div>

            <!-- قسم الـ QR Code -->
            <div class="qr-section">
                <h3>QR Code الخاص بملفك الشخصي (امسحه لعرض البيانات)</h3>
                <div id="qrcode"></div>
            </div>

        </div>
    </div>

</body>
</html>
